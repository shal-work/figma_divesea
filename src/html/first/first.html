<section class="first">
    <h1 class="visually-hidden">DiveSea web-site for verstaem.online</h1>
    <div class="first__content">
        <div class="first__left">
            <picture class="logo">
                <source type="image/webp" srcset="assets/img/logo_54.webp">
                <img class="logo__link-img" src="assets/img/logo_54.png" alt="Logo DiveSea"  width="54" height="54">
            </picture>
            <div class="first__wallet">
                <h2 class="first__title">Choose Wallet</h2>
                <a class="first__btn" href="#">
                    <picture>
                        <source type="image/webp" srcset="assets/img/metamask_30.webp"  media="(max-width: 767px)">
                        <source type="image/png" srcset="assets/img/metamask_30.png" media="(max-width: 767px)">
                        <source type="image/webp" srcset="assets/img/metamask_40.webp">
                        <img class="first__img" src="assets/img/metamask_40.png" alt="Logo Finsweet"  width="40" height="40">
                    </picture>
                    <p class="first__text">Metamask</p>
                </a>
                <a class="first__btn" href="#">
                    <picture>
                        <source type="image/webp" srcset="assets/img/trustwallet_30.webp"  media="(max-width: 767px)">
                        <source type="image/png" srcset="assets/img/trustwallet_30.png" media="(max-width: 767px)">
                        <source type="image/webp" srcset="assets/img/trustwallet_40.webp">
                        <img class="first__img" src="assets/img/trustwallet_40.png" alt="Logo Finsweet"  width="40" height="40">
                    </picture>
                    <p class="first__text">Trust Wallet</p>
                </a>
                <a class="first__btn" href="#">
                    <picture>
                        <source type="image/webp" srcset="assets/img/ethereum_30.webp"  media="(max-width: 767px)">
                        <source type="image/png" srcset="assets/img/ethereum_30.png" media="(max-width: 767px)">
                        <source type="image/webp" srcset="assets/img/ethereum_40.webp">
                        <img class="first__img" src="assets/img/ethereum_40.png" alt="Logo ethereum"  width="40" height="40">
                    </picture>
                    <p class="first__text">Enter ethereum address</p>
                </a>
                <a href="main.html" class="btn first__btn-custom  btn-black text-nobreak text-uppercase">Next</a>
            </div>
            <div class="first__footer">
                <p class="first__footer-item">
                    Privacy Policy
                </p>
                <p class="first__footer-item">
                    Copyright 2022
                </p>
            </div>
        </div>
        <div class="first__right illustration">
            <div class="illustration__inner">
                <div class="illustration__slides">
                    <div class="illustration__item">
                        <img class="illustration__img" src="assets/img/rectangle_1_393.png" alt="rectangle_1" width="393" height="392">
                    </div>
                    <div class="illustration__item">
                        <img class="illustration__img" src="assets/img/rectangle_2_393.png" alt="rectangle_2" width="393" height="392">
                    </div>
                    <div class="illustration__item">
                        <img class="illustration__img" src="assets/img/rectangle_3_393.png" alt="rectangle_3" width="393" height="392">
                    </div>
                </div>
            </div>
            <h3 class="illustration__title">
                Start Your Own NFT Gallery
            </h3>
            <p class="illustration__text">
                CloseSea Is A Great Platform For Discover Largest NFTs And Other Stuff !!
            </p>
            <div class="illustration__btns btn-dual">
                <button type="button" class="btn btn-spike-prev disabled" data-slide="prev" aria-label="Вперед"></button>
                <button type="button" class="btn btn-spike-next" data-slide="next" aria-label="Назад"></button>
            </div>
        </div>
   </div>
</section>
